{% set name = "picmistandard" %}
{% set version = "0.35.0" %}
{% set build = 0 %}
{% set sha256 = "79b30a7f33e4cd9822dc82f40ebd2682114136eee5e9161ddadec710d16772af" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/picmi-standard/picmi/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: {{ build }}
  noarch: python
  script:
    - {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy >=1.15
    - pydantic >=2.13
    - scipy >=1.5,<2
    - typing_extensions

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - picmistandard
  commands:
    - pip check

about:
  home: https://picmi-standard.github.io
  license: BSD-3-Clause-LBNL
  license_family: BSD
  license_file: License.txt
  summary: Standard input format for Particle-In-Cell codes

  description: |
    The Particle-In-Cell Modeling Interface (PICMI) standard
    establishes conventions for the naming and structuring of
    input files for Particle-In-Cell simulations.
  dev_url: https://github.com/picmi-standard/picmi

extra:
  recipe-maintainers:
    - ax3l
    - dpgrote
    - RemiLehe
